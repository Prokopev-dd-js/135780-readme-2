services:
  account:
    image: readme/account:stage
    build:
      context: ../..
      dockerfile: apps/account/dockerfile
    init: true
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGO_HOST: account-mongo
      MONGO_PORT: 27017
      MONGO_DB: ${ACCOUNT_MONGO_DB:-readme-account}
      MONGO_USER: ${ACCOUNT_MONGO_USER:-readme}
      MONGO_PASSWORD: ${ACCOUNT_MONGO_PASSWORD:?Set ACCOUNT_MONGO_PASSWORD in .env.stage}
      MONGO_AUTH_SOURCE: admin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env.stage}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env.stage}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-readme}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env.stage}@notification-rabbitmq:5672
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-readme.notifications}
    depends_on:
      account-mongo:
        condition: service_healthy
      notification-rabbitmq:
        condition: service_healthy

  account-mongo:
    image: mongo:8.0.32
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${ACCOUNT_MONGO_USER:-readme}
      MONGO_INITDB_ROOT_PASSWORD: ${ACCOUNT_MONGO_PASSWORD:?Set ACCOUNT_MONGO_PASSWORD in .env.stage}
      MONGO_INITDB_DATABASE: ${ACCOUNT_MONGO_DB:-readme-account}
    volumes:
      - account-mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  account-mongo-data:
