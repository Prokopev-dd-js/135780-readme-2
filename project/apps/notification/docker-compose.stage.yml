services:
  notification:
    image: readme/notification:stage
    build:
      context: ../..
      dockerfile: apps/notification/dockerfile
    init: true
    restart: unless-stopped
    environment:
      PORT: 3003
      MONGO_HOST: notification-mongo
      MONGO_PORT: 27017
      MONGO_DB: ${NOTIFICATION_MONGO_DB:-readme-notification}
      MONGO_USER: ${NOTIFICATION_MONGO_USER:-readme}
      MONGO_PASSWORD: ${NOTIFICATION_MONGO_PASSWORD:?Set NOTIFICATION_MONGO_PASSWORD in .env.stage}
      MONGO_AUTH_SOURCE: admin
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-readme}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env.stage}@notification-rabbitmq:5672
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-readme.notifications}
      SMTP_HOST: notification-mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_FROM: ${SMTP_FROM:-notifications@readme.local}
    depends_on:
      notification-mongo:
        condition: service_healthy
      notification-rabbitmq:
        condition: service_healthy
      notification-mailpit:
        condition: service_healthy

  notification-mongo:
    image: mongo:8.0.32
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${NOTIFICATION_MONGO_USER:-readme}
      MONGO_INITDB_ROOT_PASSWORD: ${NOTIFICATION_MONGO_PASSWORD:?Set NOTIFICATION_MONGO_PASSWORD in .env.stage}
      MONGO_INITDB_DATABASE: ${NOTIFICATION_MONGO_DB:-readme-notification}
    volumes:
      - notification-mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  notification-rabbitmq:
    image: rabbitmq:4.1-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-readme}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env.stage}
    volumes:
      - notification-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  notification-mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025"
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  notification-mongo-data:
  notification-rabbitmq-data:
